name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit (host C + JS preprocessor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      # The C suite needs nothing but cc; the JS preprocessor.test.mjs
      # invokes `tsc` from the workspace, so we install deps too.
      - name: Install dependencies
        run: npm ci
      # Vite strips types without checking them, so type errors only
      # surface here. tsc exits non-zero on any error (including the
      # noUnusedLocals/noUnusedParameters ones src/web/tsconfig.json
      # enables), which fails the job.
      - name: Typecheck src/web
        run: npm run typecheck
      - name: Run host-compiled C unit tests + JS preprocessor tests
        run: npm run test:unit

  wasm-shelf-audit:
    name: wasm-shelf compile audit (in-browser toolchain, Node-side)
    runs-on: ubuntu-latest
    # Catches the failure mode that's bitten us repeatedly: a sample
    # becomes uncompilable, but the browser toolchain doesn't run in
    # CI so nobody notices until a user clicks Build. The script
    # compiles every wasm-* sample headlessly via the vendored
    # toolchain in src/web/public/wasm-cc1/. Cheap (~5s wall on
    # GH runners) — runs every PR.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Compile every wasm-* sample via the vendored toolchain
        run: node scripts/audit-wasm-samples.mjs

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

